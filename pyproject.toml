[project]
name = "finalsurge-mcp"
version = "0.1.0"
description = "Read-only MCP server for Final Surge (unofficial web API)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
]

[project.urls]
Repository = "https://github.com/alexeykomissarov/finalsurge-mcp"

[project.scripts]
finalsurge-mcp = "finalsurge_mcp.server:main"
finalsurge-mcp-login = "finalsurge_mcp.login:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finalsurge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
